<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev loop — wiki, Claude Code, Linear</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>The loop: wiki plans it, Linear tracks it, hooks close it</h1>

    <svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dev-loop-title dev-loop-desc">
      <title id="dev-loop-title">Dev loop — wiki, Claude Code, Linear</title>
      <desc id="dev-loop-desc">A Claude Code project folder runs planning, task execution, verification against a definition of done, and pull-request creation; the dev wiki supplies context and receives the plan, Linear receives issues and hands tasks back for execution, and two automatic hooks write decisions to the wiki and issue status to Linear once the pull request opens.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ZONE: project folder -->
      <rect x="320" y="64" width="320" height="472" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="400" y="68" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="76" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROJECT FOLDER · CLAUDE CODE</text>

      <!-- ARROWS (drawn before boxes) -->
      <!-- wiki → planning -->
      <line x1="240" y1="112" x2="360" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- planning → wiki -->
      <line x1="360" y1="144" x2="240" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- planning → linear -->
      <line x1="600" y1="112" x2="720" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- linear → executing -->
      <path d="M 720,144 H 668 Q 660,144 660,152 V 232 Q 660,240 652,240 H 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- executing → verifying -->
      <line x1="480" y1="272" x2="480" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- verifying → open pr -->
      <line x1="480" y1="384" x2="480" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- hook: pr → wiki -->
      <path d="M 360,464 H 160 Q 152,464 152,456 V 160" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <!-- hook: pr → linear -->
      <path d="M 600,464 H 800 Q 808,464 808,456 V 160" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

      <!-- ARROW LABELS -->
      <rect x="276" y="92" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONTEXT</text>

      <rect x="272" y="152" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="160" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRD · PLAN</text>

      <rect x="636" y="92" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ISSUES</text>

      <rect x="588" y="184" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="192" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">NEXT TASK</text>

      <rect x="160" y="304" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="164" y="312" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HOOK · WRITES</text>

      <rect x="712" y="304" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="796" y="312" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">HOOK · STATUS</text>

      <!-- NODE: dev wiki -->
      <rect x="64" y="96" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="96" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="72" y="104" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="92" y="112" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VAULT</text>
      <text x="152" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dev Brain Wiki</text>
      <text x="152" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">patterns · decisions</text>

      <!-- NODE: linear -->
      <rect x="720" y="96" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="96" width="176" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="728" y="104" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="752" y="112" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRACKER</text>
      <text x="808" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Linear</text>
      <text x="808" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">issues · how &amp; when</text>

      <!-- NODE: planning -->
      <rect x="360" y="96" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="96" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="368" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="382" y="112" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="480" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Planning</text>
      <text x="480" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">idea · research · prd</text>

      <!-- NODE: executing -->
      <rect x="360" y="208" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="208" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="368" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="382" y="224" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="480" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Executing tasks</text>
      <text x="480" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">worktree · code · commits</text>

      <!-- NODE: verifying -->
      <rect x="360" y="320" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="320" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="368" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="382" y="336" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="480" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verifying + DoD</text>
      <text x="480" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tests · definition of done</text>

      <!-- NODE: open pr -->
      <rect x="360" y="432" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="432" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="368" y="440" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="382" y="448" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="480" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Open PR</text>
      <text x="480" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">review · merge</text>

      <!-- LEGEND -->
      <line x1="40" y1="584" x2="920" y2="584" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="592" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">WORKFLOW STEP</text>

      <rect x="300" y="592" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="320" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">WIKI · KNOWLEDGE</text>

      <rect x="480" y="592" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">LINEAR · TRACKER</text>

      <line x1="660" y1="598" x2="680" y2="598" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="688" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HOOK · AUTOMATIC</text>
    </svg>
  </div>
</body>
</html>
